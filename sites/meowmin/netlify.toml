[build]
  base = "landing"
  command = "bash scripts/build.sh"
  publish = "dist"

# Serve the Flutter app at /app without a trailing-slash redirect.
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

# Astro pages are pre-rendered static files; no rewrites required.

# Hashed Flutter assets are immutable and safe to cache for a year.
[[headers]]
  for = "/app/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Flutter entry point and service worker must always revalidate.
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
