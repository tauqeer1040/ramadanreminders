name: ramadan_reflections
description: "Meowmin AI Diary — write your daily diary, get Quran stories and verses that match your day."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  audioplayers: ^6.5.1
  hijri: ^3.0.0
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  translator: ^1.0.4+1
  confetti: ^0.8.0
  flutter_confetti: ^0.5.1
  flutter_animate: ^4.5.2 
  adhan: ^2.0.0+1
  text_scroll: ^0.2.1
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  fl_chart: ^1.1.1
  google_sign_in: ^6.2.1
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  flutter_card_swiper: ^7.2.0
  scratcher: ^2.5.0
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  skeletonizer: ^2.1.3
  lottie: ^3.3.3
  in_app_review: ^2.0.12
  share_plus: ^10.1.4
  home_widget: ^0.9.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  workmanager: ^0.9.0+3
  firebase_analytics: ^12.4.3
  package_info_plus: ^8.0.0
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  purchases_flutter: ^10.6.0
  purchases_ui_flutter: ^10.6.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4
flutter:
  uses-material-design: true
  assets:
    - assets/photos/mascot/
    - assets/photos/elements/
    - assets/tunes/
    - assets/tunes/sfx/
    - assets/chatbubbles/
    - assets/shop/thumbs/
    - assets/shop/full/
    - assets/shop/widget/
    - assets/splash/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-latin.woff2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/photos/mascot/face.webp"
  min_sdk_android: 21
  adaptive_icon_background: "#9D50FF"
  adaptive_icon_foreground: "assets/photos/mascot/face.webp"
  web:
    generate: true
    image_path: "assets/photos/mascot/face.webp"
    background_color: "#000000"
    theme_color: "#000000"
