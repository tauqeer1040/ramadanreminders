app = "meowmin-app"
primary_region = "ams"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3007"

[http_service]
  internal_port = 3007
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
