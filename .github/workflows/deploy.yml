name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web
        run: flutter build web --release --base-href /app/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Install landing deps
        working-directory: sites/meowmin
        run: npm ci

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Build landing site
        working-directory: sites/meowmin
        run: npm run build

      - name: Assemble public/
        run: node scripts/prepare-public.mjs

      - name: Bundle worker
        run: npm run build:worker

      - name: Verify worker bundle exists
        run: test -f public/_worker.js || { echo "::error::public/_worker.js missing — API would serve HTML"; exit 1; }

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy public --project-name meowmin --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy taucity landing to Cloudflare Pages
        run: npx wrangler pages deploy sites/taucity --project-name taucity --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
