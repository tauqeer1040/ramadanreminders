<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Meowmin — your private AI journal companion.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meowmin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Meowmin</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <!-- Preconnect: canvaskit WASM, Firebase, RevenueCat (max 4 to avoid Lighthouse warning) -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.googleapis.com" />
  <link rel="preconnect" href="https://api.revenuecat.com" />
  <link rel="preconnect" href="https://firebaseapp.com" />

  <!-- Preload the main Dart bundle so the browser fetches it immediately -->
  <link rel="preload" href="main.dart.js" as="script" />
  <!-- Show the animated splash GIF instantly (no extra request after preload) -->
  <link rel="preload" as="image" href="assets/assets/splash/splash.gif" fetchpriority="high" />

  <style id="splash-screen-style">
    html {
      height: 100%;
      background-color: #000000;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #000000;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      var splash = document.getElementById("splash");
      if (!splash) return;
      splash.style.transition = 'opacity 0.3s';
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    }
    // The Flutter app calls removeSplashFromWeb() when the target screen
    // (home/onboarding) has painted its first frame. Failsafe: never let the
    // splash outstay its welcome.
    // Failsafe: only remove splash after 30s (gives Flutter plenty of time on
    // slow connections). Flutter calls removeSplashFromWeb() much earlier.
    setTimeout(function () {
      if (document.getElementById("splash")) {
        removeSplashFromWeb();
      }
    }, 30000);
  </script>
</head>
<body>

  <!-- Branded animated splash — visible from first paint, removed when Flutter's target screen is ready -->
  <div id="splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000000;z-index:9999;">
    <img src="assets/assets/splash/splash.gif" alt="Loading" style="max-width:100%;max-height:100%;object-fit:contain;" />
  </div>

  <script src="flutter_bootstrap.js" async=""></script>

</body></html>
